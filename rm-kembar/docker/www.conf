; PHP-FPM pool config for RM Kembar production (ARM64)
[www]
user = www-data
group = www-data

; Dynamic process manager — scales workers based on load
pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 10

; Recycle workers after 500 requests to prevent memory leaks
pm.max_requests = 500

; Pass environment variables from Docker into PHP
clear_env = no

; Slow log — log requests taking > 10s
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2

; Status endpoint (optional, useful for monitoring)
pm.status_path = /fpm-status
