; OPcache config for RM Kembar
; This warms ALL workers so incognito / fresh sessions don't feel slow

[opcache]
opcache.enable=1
opcache.enable_cli=0

; Memory for compiled bytecode — 128MB is plenty for a Laravel app
opcache.memory_consumption=128

; How many PHP files can be cached
opcache.max_accelerated_files=10000

; How often (seconds) OPcache checks disk for file changes
; Set to 0 in production (never recheck), 2 for dev (recheck every 2s)
opcache.revalidate_freq=2

; Don't validate file timestamps in production for max speed
; Keep validate_timestamps=1 for dev so code changes are picked up
opcache.validate_timestamps=1

; String interning memory
opcache.interned_strings_buffer=16

; Aggressive optimization level (0-3)
opcache.optimization_level=0x7FFEBFFF

; Pre-warm on startup (PHP 7.4+)
; opcache.preload=/var/www/bootstrap/cache/packages.php
; opcache.preload_user=www-data
