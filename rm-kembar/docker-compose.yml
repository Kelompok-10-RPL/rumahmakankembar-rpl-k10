version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rmkembar-app
    container_name: rmkembar-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - rmkembar-vendor:/var/www/vendor
    networks:
      - rmkembar-network

  webserver:
    image: nginx:alpine
    container_name: rmkembar-webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - rmkembar-network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: rmkembar-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-rmkembar}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-rmkembar}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - rmkembar-network

  redis:
    image: redis:alpine
    container_name: rmkembar-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - rmkembar-network

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: rmkembar-evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENV=true
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,FATAL
      - LOG_COLOR=true
      - LOG_BAILEYS=error
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=YOUR_SECRET_KEY_HERE
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres@evolution-postgres:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - RABBITMQ_ENABLED=false
      - WEBSOCKET_ENABLED=false
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379
      - CACHE_REDIS_PREFIX_KEY=evolution
    networks:
      - rmkembar-network
    depends_on:
      - evolution-postgres
      - evolution-redis

  evolution-postgres:
    image: postgres:15-alpine
    container_name: rmkembar-evolution-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=evolution
      - TZ=Asia/Jakarta
    volumes:
      - evolution-postgres-data:/var/lib/postgresql/data
    networks:
      - rmkembar-network

  evolution-redis:
    image: redis:alpine
    container_name: rmkembar-evolution-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution-redis-data:/data
    networks:
      - rmkembar-network

networks:
  rmkembar-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  evolution-postgres-data:
  evolution-redis-data:
  rmkembar-vendor:
